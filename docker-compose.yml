services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinicready}
      POSTGRES_USER: ${POSTGRES_USER:-clinicready}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinicready}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # api:  added in YOS-8 (Spring Boot skeleton)

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    # Enable once the `api` service exists (YOS-8). nginx proxies /api/ to http://api:8080
    # (see frontend/nginx.conf) and starts fine even while the API is down.
    # depends_on:
    #   - api

volumes:
  pgdata:
