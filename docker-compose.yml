services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinicready}
      POSTGRES_USER: ${POSTGRES_USER:-clinicready}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinicready}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-clinicready}
      POSTGRES_USER: ${POSTGRES_USER:-clinicready}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      # Seeds synthetic login users (backend/src/main/resources/db/seed-dev).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DOCUMENTS_MAX_SIZE: ${DOCUMENTS_MAX_SIZE:-10MB}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # Uploaded patient documents (outside the database).
      - documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    # nginx proxies /api/ to http://api:8080 (see frontend/nginx.conf).
    depends_on:
      - api

volumes:
  pgdata:
  documents:
